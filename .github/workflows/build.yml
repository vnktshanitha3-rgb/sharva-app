[app]
title = SHARVA
package.name = sharva
package.domain = org.sharva
source.dir = .
source.include_exts = py,png,jpg,kv,atlas,ttf
version = 0.1
requirements = python3,kivy
orientation = portrait
fullscreen = 0

# Android architecture (only 64-bit for modern phones, builds faster)
android.archs = arm64-v8a

[buildozer]
# Normal log level to prevent log truncation / memory crash
log_level = 1
warn_on_root = 1

[buildozer:android]
android.api = 34
android.minapi = 26
android.ndk_api = 26
android.accept_sdk_license = True
android.permissions = INTERNET
