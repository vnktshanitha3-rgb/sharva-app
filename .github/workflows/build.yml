[app]
title = SHARVA
package.name = sharva
package.domain = org.sharva
source.dir = .
source.include_exts = py,png,jpg,kv,atlas,ttf
version = 0.1
requirements = python3==3.11.5,kivy
orientation = portrait
fullscreen = 0

# Only build 64-bit to prevent memory overflow and cut build time by half
android.archs = arm64-v8a

[buildozer]
# Prevents giant logs from getting truncated
log_level = 1
warn_on_root = 1

[buildozer:android]
android.api = 33
android.minapi = 24
android.ndk_api = 24
android.accept_sdk_license = True
android.permissions = INTERNET
