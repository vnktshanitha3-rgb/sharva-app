name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download Telugu Font Directly
      run: |
        curl -L -o NotoSansTelugu-Regular.ttf https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSansTelugu/NotoSansTelugu-Regular.ttf

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libltdl-dev
        pip install --upgrade pip
        pip install "buildozer>=1.5.0" cython

    - name: Configure Exact Android SDK and Stable NDK
      run: |
        export ANDROID_SDK_DIR="/usr/local/lib/android/sdk"
        mkdir -p ~/.buildozer/android/platform
        ln -sfn $ANDROID_SDK_DIR ~/.buildozer/android/platform/android-sdk
        mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
        ln -sf $ANDROID_SDK_DIR/cmdline-tools/latest/bin/* ~/.buildozer/android/platform/android-sdk/tools/bin/
        yes | $ANDROID_SDK_DIR/cmdline-tools/latest/bin/sdkmanager --licenses || true

        # Download Stable NDK r25b directly
        curl -o ndk.zip https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
        unzip -q ndk.zip -d ~/.buildozer/android/platform/
        rm ndk.zip

    - name: Build APK with Buildozer
      run: |
        APP_ANDROID_NDK_HOME=~/.buildozer/android/platform/android-ndk-r25b buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: sharva-app
        path: bin/*.apk
