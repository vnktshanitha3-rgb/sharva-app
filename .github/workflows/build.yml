name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libltdl-dev ccache

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip setuptools wheel
        pip install "cython<3.0.0" buildozer

    - name: Prepare Android SDK for Buildozer
      run: |
        # Accept licenses on runner SDK
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

        # Buildozer looks specifically for tools/bin/sdkmanager
        mkdir -p $ANDROID_HOME/tools/bin
        ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/sdkmanager

        # Link runner SDK directly to buildozer directory
        mkdir -p ~/.buildozer/android/platform
        ln -sfn $ANDROID_HOME ~/.buildozer/android/platform/android-sdk

    - name: Configure and Build APK
      run: |
        rm -f buildozer.spec
        buildozer init
        sed -i 's/title = My Application/title = SHARVA/' buildozer.spec
        sed -i 's/package.name = myapp/package.name = sharva/' buildozer.spec
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy/' buildozer.spec
        sed -i 's/#android.archs = arm64-v8a, armeabi-v7a/android.archs = arm64-v8a/' buildozer.spec
        sed -i 's/android.archs = arm64-v8a, armeabi-v7a/android.archs = arm64-v8a/' buildozer.spec
        sed -i 's/#android.api = .*/android.api = 33/' buildozer.spec
        sed -i 's/#android.minapi = .*/android.minapi = 21/' buildozer.spec
        sed -i 's/#android.ndk = .*/android.ndk = 25b/' buildozer.spec
        sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        sed -i 's/android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec

        yes | buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SHARVA-APK
        path: bin/*.apk
