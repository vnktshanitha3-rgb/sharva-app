name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Prepare buildozer.spec
      run: |
        pip install buildozer
        yes | buildozer init
        sed -i 's/title = My Application/title = SHARVA/' buildozer.spec
        sed -i 's/package.name = myapp/package.name = sharva/' buildozer.spec
        sed -i 's/android.api = 31/android.api = 33/' buildozer.spec
        sed -i 's/android.minapi = 21/android.minapi = 24/' buildozer.spec

    - name: Build with Buildozer Action
      uses: ArtemSBulgakov/buildozer-action@v1
      with:
        workdir: .
        buildozer_version: stable

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SHARVA-APK
        path: bin/*.apk
        
